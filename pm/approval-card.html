<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隔离任务审批卡</title><style>body{font:16px/1.6 system-ui;background:#edf2f7;color:#172439;max-width:960px;margin:32px auto;padding:20px}article,section{background:white;padding:24px;border-radius:12px;margin-bottom:18px;border:1px solid #d8e2ec}h1{margin:0}h2{font-size:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;padding:16px;font-size:14px}button{padding:12px 20px;margin:8px 8px 0 0;border-radius:8px;border:1px solid #bccadd;cursor:pointer;background:#fff;color:#172439}button.primary{background:#215fd1;color:white}button:disabled{opacity:.45;cursor:not-allowed}textarea{width:95%;height:74px;padding:10px}.status{font-weight:700;color:#8b5400}label{display:block}#message{white-space:pre-wrap}</style><body><article><h1>隔离任务审批卡</h1><p class="status" id="status">PENDING · 尚未取得真实用户审批</p><p>身份机制：一次性能力持有人确认。不是 平台 账户认证，也不代表多用户实名身份。审批服务仅允许 127.0.0.1 访问。</p><p id="connection">正在检查入口。离线预览不能审批。</p></article><section id="registration"><h2>1. 确认能力会话</h2><label><input type="checkbox" id="holder"> 我正在亲自操作，理解此链接赋予启动时选择的限时审批能力（当前可信配置仅允许 normal；destructive 必须由能力管理员另行配置，启动参数不能扩权），并确认注册本次会话。</label><button id="register" disabled>确认并建立审批会话</button></section><section><h2>2. 审阅完整提案</h2><pre id="proposal">提案尚未加载</pre><textarea id="note" placeholder="要求修改时说明目标或验收条件；备注不会自行扩权"></textarea><div><button id="approve" class="primary" disabled>批准此版本和限定范围</button><button id="change" disabled>要求修改 · 新版本重新审批</button><button id="reject" disabled>拒绝此版本</button></div></section><section><h2>3. 执行与回执</h2><p>批准只生成限时授权；执行会在配置的固定镜像中，通过无网络、无宿主挂载的合成 Docker worktree 调用真实内核。服务关闭或网络中断不会被显示为成功。</p><button id="execute" disabled>执行已批准的隔离任务</button><pre id="message">服务未启动或尚未审批；没有执行。</pre></section><!--OFFLINE_PROPOSAL--><script src="card.js" defer></script></body></html>
