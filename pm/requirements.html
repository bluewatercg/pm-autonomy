<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求池</title><style>body{font:16px/1.6 system-ui;max-width:1000px;margin:24px auto;padding:20px;color:#172439;background:#edf2f7}section{background:white;padding:20px;margin:16px 0;border:1px solid #ccd8e5;border-radius:10px}label{display:block;margin:8px 0}input,select,textarea{font:inherit;padding:7px;max-width:95%}textarea{width:95%;height:70px}button{font:inherit;padding:8px 14px;margin:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{color:#8b5400}</style><body><h1>需求池</h1><p><a href="/">审批卡与会话登记</a> · 想法 → 讨论 → 待决策 → 待审批提案 → 批准 → 任务执行与验收。</p><p>依赖按持久验收闭合判断。满足条件仅表示可供决策；无自动提醒、批准或执行。转换目前仅绑定已有合成 history.py 排序合同，自由文本目标不会生成业务代码。</p><p id="session">正在核实会话</p><p id="message" role="status"></p><section><h2>登记新想法</h2><label>需求编号 <input id="id" placeholder="R-001"></label><label>目标 <textarea id="goal"></textarea></label><label>来源引用（不要粘贴完整聊天或秘密） <input id="source" placeholder="本次需求沟通摘要"></label><label>来源时间（含时区） <input id="time"></label><label><input type="checkbox" id="uncertain"> 来源或旧聊天决定尚未确认</label><button id="add" disabled>登记为讨论中</button></section><section><h2>批量跟踪</h2><select id="filter"><option value="all">全部需求</option><option value="ready">可供决策</option><option value="deferred">暂缓</option></select><button id="refresh">刷新可信状态</button><div id="list"></div></section><section><h2>单条需求讨论与规划</h2><p id="selected">先选择一条需求</p><label>负责人（空表示未确定） <input id="owner"></label><label>优先级 <select id="priority"><option value="">未确定</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label><label>待解决问题（每行一条） <textarea id="questions"></textarea></label><label>安排在这些任务验收闭合之后（每行一个已登记 task ID） <textarea id="after"></textarea></label><label>讨论记录或决策理由 <textarea id="note"></textarea></label><label>新状态 <select id="state"><option value="discussing">讨论中</option><option value="awaiting_decision">待决策</option><option value="rejected">拒绝</option><option value="superseded">被现需求取代</option></select></label><label>取代需求编号 <input id="replacement"></label><button id="append" disabled>追加讨论</button><button id="update" disabled>更新负责人、优先级与条件</button><button id="defer" disabled>暂缓（必须写理由）</button><button id="change-state" disabled>记录状态决定</button><button id="convert" disabled>确定：转为合成合同待审批提案</button><pre id="details"></pre></section><script src="requirements.js" defer></script></body></html>
